name: Docs

# Builds the documentation site on every pull request and every push to
# `develop`, so a broken link is a red check rather than a broken page, and
# deploys it on every push to `develop` and on `workflow_dispatch`.
#
# The site is what GitHub Pages serves, and deploying from `develop` is what
# makes the README's links into the documentation live.

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]
    workflow_dispatch:

concurrency:
    group: docs-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
    contents: read

env:
    # Pinned: a Zensical release can change what counts as a warning, and a docs
    # build that suddenly fails on an unrelated PR is worse than a deliberate
    # bump. This is the version the site is built and checked with locally.
    ZENSICAL_VERSION: "0.1.0"

jobs:
    build:
        name: build (--strict)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v5
            # `--strict` aborts on a warning, and link validation is on: every
            # internal link and every link anchor is resolved, so a renamed heading or
            # a moved page fails this job.
            - name: Build
              run: uvx "zensical==$ZENSICAL_VERSION" build --strict
            - uses: actions/configure-pages@v5
            - name: Upload the site
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        name: deploy (GitHub Pages)
        needs: build
        # A pull request builds the site and stops there: deploying from a feature
        # branch would be refused by the `github-pages` environment.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v4
