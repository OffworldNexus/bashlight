# bashlight's documentation site.
#
# Build it with `uvx zensical build --strict`, preview it with
# `uvx zensical serve`. Link validation is on: a renamed heading or a moved
# page turns `--strict` red instead of shipping a broken link.

[project]
site_name = "bashlight"
site_url = "https://offworldnexus.github.io/bashlight/"
site_description = "Rewrite the bash commands an LLM agent runs so they match the project, without the agent noticing."
site_author = "Offworld Nexus"
copyright = "&copy; 2026 Offworld Nexus &middot; Apache 2.0"

repo_url = "https://github.com/OffworldNexus/bashlight"
repo_name = "OffworldNexus/bashlight"
edit_uri = "edit/develop/docs/"

docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "How it works" = "how-it-works.md" },
  { "Rules" = "rules.md" },
  { "Monitoring" = "monitoring.md" },
  { "Benchmark" = "benchmark.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "toc.follow",
]

[project.theme.icon]
edit = "material/pencil"
view = "material/eye"

# The palette lives in `docs/stylesheets/extra.css`; `custom` hands it the two
# colour variables it defines.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# A broken link or a link to a missing anchor fails `--strict`, which is what
# `.github/workflows/docs.yml` runs.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
