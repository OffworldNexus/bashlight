[project]
name = "report"
version = "0.1.0"
description = "A tiny report CLI used by the bashlight benchmark."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
report = "report.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report"]
