[project]
name = "uv-cli"
version = "0.1.0"
description = "A small command line tool used by the bashlight benchmark."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
uv-cli = "uvcli.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11", "mypy>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvcli"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 88
